# The one and only config. run.sh reads THIS — there is nothing else to configure.
# Flag mapping: `name: value` -> --name value | `name: true` -> --name | `name: false` -> omitted.

server:
  image: myllmbox/qwen38-flash-next-vllm:v5     # pinned public tag (digest in README) = vLLM 0.30.0 (vllm/vllm-openai) + patches:
                                                # the NVFP4 n-gram table, the 4-bit output head (hibrid48) — stock 0.30 cannot load
                                                # either — the fused multi-step MTP draft, the loader's page-cache hygiene.
                                                # v3 (vLLM 0.29, image v3) = `git checkout v3`.
  docker_args: --security-opt seccomp=unconfined   # required by the image's table reader
  cpuset: "5-9,15-19"                           # the GB10's 10 Cortex-X925 3.9GHz cores (0-4,10-14
                                                # are 2.8GHz A725) — measured +2-3% at every concurrency
  model: myllmbox/Qwen3.8-Flash-Next-hibrid48   # HF repo — downloaded into ./models on first run (~98G)
  # model: myllmbox/Qwen3.8-Flash-Next-hibrid48-uncensored   # the abliterated body (OrcaRouter) with the same head, 98G:
                                                # no refusals, NO guardrails — research / red-teaming / private use behind your
                                                # own moderation. GATED on Hugging Face: accept its agreement, then hf auth login
                                                # or export HF_TOKEN (run.sh checks). Same n-gram table, same speed; nothing else
                                                # in this file changes. Set served-model-name to Qwen/Qwen3.8-Flash-Next-Uncensored
                                                # if you run both and want them told apart.
  port: 8000
  models_dir: ./models
  cache_dir: ./cache                            # compile caches + the table map (~31G, prepared on the first boot); deletable,
                                                # the next boot rebuilds it
  patches: ""                                   # optional vLLM patches from patches/, space-separated (e.g. hermes-chat);
                                                # default none = the stock image. See patches/README.md

env:
  MBX_PLE_MMAP: "1"
  MBX_PLE_MMAP_MODE: "nvme"
  MBX_PLE_MMAP_PREWARM: "0"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  # No OMP_NUM_THREADS: vLLM sizes its threads itself (many for the load, one for serving); a fixed value hurts one phase.
  PYTHONUNBUFFERED: "1"                         # load progress actually shows in ./view.sh
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"               # Marlin small-N fast path (self-gating)
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  MALLOC_MMAP_THRESHOLD_: "65536"               # glibc returns big freed blocks to the OS at once (the loader's
  MALLOC_TRIM_THRESHOLD_: "131072"              # garbage otherwise stays resident — and swaps)

vllm:
  served-model-name: Qwen/Qwen3.8-Flash-Next
  engram-config: '{"cpu_offload": false}'
  gdn-prefill-backend: triton
  moe-backend: marlin                           # fastest MoE kernel for NVFP4 W4A16 on the GB10
  distributed-executor-backend: mp
  gpu-memory-utilization: 0.70                  # with kv-cache-memory pinned this does not size the KV pool
  kv-cache-memory: "27000000000"                # 27G bf16 = 830,582 KV tokens (3.17 full 262K requests). Leaves ~2G available
                                                # at 16 streams; 26G if you run other things on the box
  load-format: fastsafetensors                  # weights in ~80 s; remove for vLLM's default loader (~10 min)
  max-model-len: 262144                         # the model's native max
  block-size: 1632                              # required at K=5 (the model's attention ring must divide the block)
  compilation-config: '{"cudagraph_mode":"PIECEWISE","cudagraph_capture_sizes":[1,2,4,6,8,12,16,18,24,30,36,42,48,54,60,66,72,78,84,90,96],"compile_ranges_endpoints":[32]}'
                                                # sizes = multiples of K+1 (=6) up to seats × 6; shorten only with max-num-seqs
  # compilation-config: '{"cudagraph_mode":"PIECEWISE","cudagraph_capture_sizes":[1,2,3,4,5,6,7,8,10,12,14,15,16,18,20,21,24,25,28,30,32,35,36,40,42,44,45,48,49,50,52,54,55,56,60,63,64,65,66,70,72,75,77,78,80,84,90,91,96,98,105,112],"compile_ranges_endpoints":[32]}'
                                                # with mtp_depth.mode: dynamic — every depth 3..6 × seats
  max-num-seqs: 16                              # each running request pins ~36k tokens of pool (the model's GDN state, K=5):
                                                # 16 seats is the practical top of this pool
  max-num-batched-tokens: 8192                  # also the image-input encoder budget — keep for image requests
  enable-prefix-caching: true
  enable-auto-tool-choice: true
  tool-call-parser: qwen3_xml
  reasoning-parser: qwen3
  speculative-config: '{"method":"mtp","num_speculative_tokens":5,"rejection_sample_method":"block","draft_sample_method":"probabilistic"}'
                                                # 5 draft tokens sampled from the drafter: ~5.1 of 6 accepted on code
  # speculative-config: '{"method":"mtp","num_speculative_tokens":6,"rejection_sample_method":"block","draft_sample_method":"probabilistic"}'
                                                # with mtp_depth.mode: dynamic — 6 = the deepest a request may draft
  async-scheduling: true


# Dynamic draft depth (opt-in). Each request picks its own draft depth between `min` and num_speculative_tokens from
# what it has recently accepted; a batch drafts the requests' average depth. Measured on one Spark against fixed K=5,
# 1 to 12 streams: long prose +12 to +19 %, mixed text / JSON / code within ±2 %. To use it: mode: dynamic, and swap
# in the two commented lines above (num_speculative_tokens 6 + its capture sizes). run.sh writes cache/mbx-depth.json;
# the serve re-reads that file while it runs, so the numbers below can be changed live.
mtp_depth:
  mode: off                                     # off = fixed K (default) | dynamic
  min: 3                                        # lowest draft depth
  window: 48                                    # steps of history each decision looks at (8–128)
  promote: [60, 45]                             # +2 / +1 depth when the deepest position was accepted on more than this % of steps
  demote: [25, 15]                              # −1 / −2 depth when below this %
  log: false                                    # true = one log line per decision (depth before → after, the measured rate)
